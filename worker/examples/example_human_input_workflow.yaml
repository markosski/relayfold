id: human-input-agent-workflow
description: Prepare a release announcement, asking a human to supply the missing release channel.

# The Agent discovers that a required business decision is missing and pauses
# for human input.
#
# Try it locally after starting RunHelm and configuring gemini_api_key:
#
#   export RUNHELM_URL=http://localhost:3000
#
#   curl -sS -X POST "$RUNHELM_URL/workflow-def" \
#     --data-binary @worker/examples/example_human_input_workflow.yaml
#
#   curl -sS -X POST \
#     "$RUNHELM_URL/workflow-def/human-input-agent-workflow" \
#     -H 'content-type: application/json' \
#     -d '{}'
#
# Copy the returned workflow instance ID, wait for the task to enter
# InputNeeded, and submit the missing channel:
#
#   export WORKFLOW_ID=human-input-agent-workflow-...
#
#   curl -sS \
#     "$RUNHELM_URL/workflows/$WORKFLOW_ID/tasks/release-announcement"
#
#   curl -sS -X POST \
#     "$RUNHELM_URL/workflows/$WORKFLOW_ID/tasks/release-announcement/human-input" \
#     -H 'content-type: application/json' \
#     -d '{ "input": "stable" }'
#
# Read the same task endpoint again to see the completed announcement.

tasks:
  - id: release-announcement
    kind:
      agent:
        model_id: "google/gemini-3-flash-preview"
        provider_url: ""
        prompt: |
          You are a release coordinator preparing an announcement for RunHelm 1.4.0.

          Release facts:
          - Added reusable Agent sessions.
          - Added human input for missing workflow decisions.
          - Fixed duplicate task attempts after workflow resume.

          Every announcement must target exactly one release channel: stable,
          beta, or nightly. Do not invent release facts or choose a channel on
          the operator's behalf.

          Return exactly this JSON shape:
          {
            "response": "<a concise announcement appropriate for the channel>",
            "channel": "<channel>"
          }
        tools: []
        skills: []
        ask: true
        schema_failure_retry_times: 2
        reuse_session: true
    output_schema:
      type: object
      required:
        - response
        - channel
      properties:
        response:
          type: string
        channel:
          type: string
          enum:
            - stable
            - beta
            - nightly
    required_credentials:
      - gemini_api_key

data_bindings: []
