id: simple-function-workflow
description: Greet a user and return their normalized name with one inline Function task.

# This example requires no model provider, credentials, tools, or workspace.
#
# Try it locally after starting RunHelm:
#
#   export RUNHELM_URL=http://localhost:3000
#
#   curl -sS -X POST "$RUNHELM_URL/workflow-def" \
#     --data-binary @worker/examples/example_simple_function_workflow.yaml
#
#   curl -sS -X POST \
#     "$RUNHELM_URL/workflow-def/simple-function-workflow" \
#     -H 'content-type: application/json' \
#     -d '{ "name": "Ada Lovelace" }'
#
# Copy the returned workflow instance ID and read the result:
#
#   export WORKFLOW_ID=simple-function-workflow-...
#
#   curl -sS "$RUNHELM_URL/workflows/$WORKFLOW_ID/tasks/greeter"

tasks:
  - id: greeter
    kind:
      Function:
        dependencies: []
        code: |
          export default async function run({ inputs }) {
            const user = inputs[0] ?? {};
            const name = user.name ?? "friend";

            return {
              response: `Hello, ${name}!`,
              normalizedName: String(name).trim().toLowerCase()
            };
          }
    input_schemas:
      - type: object
        properties:
          name:
            type: string
    output_schema:
      type: object
      required:
        - response
        - normalizedName
      properties:
        response:
          type: string
        normalizedName:
          type: string
    required_credentials: []

data_bindings: []
