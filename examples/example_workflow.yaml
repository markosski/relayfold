id: simple-function-workflow

tasks:
  - id: test
    kind:
      agent:
        model_id: "google/gemini-3-flash-preview"
        provider_url: ""
        prompt: |
          Perform the following actions:
          - Use curl to access https://markosski.github.io/runhelm/
          - Download the content to /tmp/index.html
          - Extract the title of the page and return as response

          {
            "response": "summary of the content",
          }
        tools: ["read", "write", "edit"]
        skills: []
        ask: false
        schema_failure_retry_times: 2
    output_schema:
      type: object
      required:
        - response
      properties:
        response:
          type: string
    required_credentials:
      - gemini_api_key


data_bindings: []
